
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex — Bootcamp II</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <p>Busque um Pokémon pelo nome ou número</p>
    </header>

    <main>

        <!-- Busca de Pokémon -->
        <section class="busca">
            <input
                type="text"
                id="campo-busca"
                placeholder="Ex.: pikachu ou 25"
            >

            <button id="botao-buscar">
                Buscar
            </button>

            <button id="botao-aleatorio">
                Pokémon Aleatório
            </button>
        </section>

        <!-- Resultado da busca -->
        <section id="resultado"></section>

        <!-- Pokémon favoritos -->
        <section class="favoritos">
            <h2>Meus favoritos</h2>

            <div id="lista-favoritos"></div>
        </section>

    </main>

    <footer>
        Dados: PokeAPI (pokeapi.co) · Projeto da disciplina Bootcamp II
    </footer>

    <!-- Biblioteca Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Configuração do banco -->
<script src="config.js"></script>

<!-- Código principal da Pokédex -->
<script src="script.js"></script>

</body>
</html>
